<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cafe Rezervasyon Sistemi</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #f4f6f8;
      color: #222;
      padding-bottom: 40px;
    }


    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      text-align: center;
    }


    header h1 {
      font-size: 24px;
    }


    header p {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 14px;
    }


    .container {
      width: 95%;
      max-width: 800px;
      margin: 20px auto;
    }


    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
    }


    h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }


    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }


    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }


    textarea {
      resize: vertical;
      min-height: 80px;
    }


    button {
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =========================
       GİRİŞ EKRANI
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f6f8;
    }


    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.12);
    }


    .login-card h1 {
      text-align: center;
      margin-bottom: 8px;
    }


    .login-card p {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }


    .login-btn {
      width: 100%;
      margin-top: 20px;
      background: #16a34a;
      color: white;
    }


    .login-btn:hover {
      background: #15803d;
    }


    .login-error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 14px;
    }


    /* =========================
       ANA SİSTEM
    ========================= */

    #app {
      display: none;
    }


    .user-bar {
      width: 95%;
      max-width: 800px;
      margin: 15px auto 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;

      background: white;
      padding: 12px 15px;
      border-radius: 12px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }


    .user-info {
      font-size: 14px;
      color: #374151;
      overflow-wrap: anywhere;
    }


    .logout-btn {
      background: #dc2626;
      color: white;
      padding: 9px 13px;
      font-size: 13px;
      white-space: nowrap;
    }


    .add-btn {
      width: 100%;
      margin-top: 20px;
      background: #16a34a;
      color: white;
    }


    .add-btn:hover {
      background: #15803d;
    }


    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }


    .stat-box {
      background: #1f2937;
      color: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }


    .stat-number {
      font-size: 26px;
      font-weight: bold;
      margin-top: 5px;
    }


    .reservation {
      border-left: 5px solid #16a34a;
      background: #f9fafb;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }


    .reservation-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }


    .reservation-name {
      font-size: 18px;
      font-weight: bold;
    }


    .reservation-info {
      margin-top: 10px;
      line-height: 1.7;
      color: #4b5563;
    }


    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px 12px;
      font-size: 13px;
    }


    .empty {
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }


    .birthday-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }


    .birthday-box input {
      width: auto;
      transform: scale(1.2);
    }


    .fee-section {
      display: none;
    }


    .date-filter {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }


    .date-filter input {
      flex: 1;
    }


    .today-btn {
      background: #2563eb;
      color: white;
      white-space: nowrap;
      padding: 10px 15px;
    }


    .loading {
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }


    .permission-warning {
      display: none;
      margin-top: 15px;
      padding: 14px;
      background: #fef3c7;
      color: #92400e;
      border-radius: 10px;
      font-size: 14px;
    }


    @media (max-width: 500px) {

      .date-filter {
        flex-direction: column;
      }


      .today-btn {
        width: 100%;
      }


      .user-bar {
        align-items: flex-start;
        flex-direction: column;
      }


      .logout-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       GİRİŞ EKRANI
  ========================= -->

  <div id="loginScreen">

    <div class="login-card">

      <h1>☕ Cafe Rezervasyon</h1>

      <p>
        Personel giriş sistemi
      </p>


      <label>
        E-posta
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="ornek@email.com"
        autocomplete="email"
      >


      <label>
        Şifre
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Şifreniz"
        autocomplete="current-password"
      >


      <button
        class="login-btn"
        id="loginButton"
        onclick="login()"
      >
        Giriş Yap
      </button>


      <div
        class="login-error"
        id="loginError"
      >
      </div>

    </div>

  </div>



  <!-- =========================
       ANA UYGULAMA
  ========================= -->

  <div id="app">


    <header>

      <h1>
        ☕ Cafe Rezervasyon Sistemi
      </h1>

      <p>
        Rezervasyon Yönetim Paneli
      </p>

    </header>



    <!-- KULLANICI BİLGİSİ -->

    <div class="user-bar">

      <div
        class="user-info"
        id="userInfo"
      >
        Yükleniyor...
      </div>


      <button
        class="logout-btn"
        onclick="logout()"
      >
        Çıkış Yap
      </button>

    </div>



    <div class="container">


      <!-- =========================
           İSTATİSTİKLER
      ========================= -->

      <div class="stats">


        <div class="stat-box">

          <div>
            Rezervasyon
          </div>

          <div
            class="stat-number"
            id="reservationCount"
          >
            0
          </div>

        </div>



        <div class="stat-box">

          <div>
            Toplam Kişi
          </div>

          <div
            class="stat-number"
            id="peopleCount"
          >
            0
          </div>

        </div>


      </div>



      <!-- =========================
           REZERVASYON EKLEME
      ========================= -->

      <div
        class="card"
        id="reservationFormCard"
      >

        <h2>
          ➕ Yeni Rezervasyon
        </h2>


        <div
          class="permission-warning"
          id="permissionWarning"
        >
          Bu hesabın rezervasyon ekleme yetkisi bulunmuyor.
        </div>



        <label>
          Ad Soyad
        </label>

        <input
          type="text"
          id="name"
          placeholder="Müşteri adı soyadı"
        >



        <label>
          Kişi Sayısı
        </label>

        <input
          type="number"
          id="people"
          min="1"
          placeholder="Örn: 4"
        >



        <label>
          Tarih
        </label>

        <input
          type="date"
          id="date"
        >



        <label>
          Saat
        </label>

        <input
          type="time"
          id="time"
        >



        <label>
          Alan
        </label>

        <select id="area">

          <option value="Bahçe">
            🌿 Bahçe
          </option>

          <option value="Teras">
            🌇 Teras
          </option>

          <option value="Salon">
            🏠 Salon
          </option>

        </select>



        <div class="birthday-box">

          <input
            type="checkbox"
            id="birthday"
            onchange="toggleFee()"
          >


          <label
            style="margin:0;"
          >
            🎂 Doğum günü kutlaması mı?
          </label>

        </div>



        <div
          class="fee-section"
          id="feeSection"
        >

          <label>
            Doğum Günü Ücreti
          </label>


          <select id="birthdayFee">

            <option value="false">
              Ücret Yok
            </option>

            <option value="true">
              Ücret Var
            </option>

          </select>

        </div>



        <label>
          Not
        </label>

        <textarea
          id="note"
          placeholder="Özel masa isteği, müşteri notu vb."
        ></textarea>



        <button
          class="add-btn"
          id="addButton"
          onclick="addReservation()"
        >
          Rezervasyon Ekle
        </button>


      </div>



      <!-- =========================
           REZERVASYON LİSTESİ
      ========================= -->

      <div class="card">


        <h2>
          📋 Rezervasyonlar
        </h2>



        <div class="date-filter">

          <input
            type="date"
            id="filterDate"
            onchange="renderReservations()"
          >


          <button
            class="today-btn"
            onclick="showToday()"
          >
            Bugün
          </button>

        </div>



        <div id="reservationList">

          <div class="loading">
            Rezervasyonlar yükleniyor...
          </div>

        </div>


      </div>


    </div>

  </div>



  <!-- =========================
       SUPABASE KÜTÜPHANESİ
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



  <script>


    /*
      ========================================
      SUPABASE BAĞLANTI BİLGİLERİ
      ========================================
    */


    const SUPABASE_URL =
      "https://moxlbxwkiwuahuoucnwo.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_TFyyOLgokQ_RxNFYmRjL-g_nff_x3dO";



    /*
      SUPABASE CLIENT
    */


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /*
      ========================================
      GENEL DEĞİŞKENLER
      ========================================
    */


    let reservations = [];


    let currentUser = null;


    let currentEmployee = null;



    /*
      ========================================
      TARİH
      ========================================
    */


    function getToday() {

      const today =
        new Date();


      const year =
        today.getFullYear();


      const month =
        String(
          today.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          today.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }



    document
      .getElementById(
        "date"
      )
      .value =
      getToday();



    document
      .getElementById(
        "filterDate"
      )
      .value =
      getToday();



    /*
      ========================================
      GİRİŞ YAP
      ========================================
    */


    async function login() {


      const email =
        document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim();



      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;



      const errorBox =
        document.getElementById(
          "loginError"
        );



      const loginButton =
        document.getElementById(
          "loginButton"
        );



      errorBox.style.display =
        "none";



      if (
        email === "" ||
        password === ""
      ) {

        showLoginError(
          "Lütfen e-posta ve şifrenizi girin."
        );

        return;

      }



      loginButton.disabled =
        true;


      loginButton.innerText =
        "Giriş yapılıyor...";



      try {


        const {
          data,
          error
        } =
        await supabaseClient.auth.signInWithPassword(
          {
            email:
              email,

            password:
              password
          }
        );



        if (
          error
        ) {

          throw error;

        }



        if (
          !data.user
        ) {

          throw new Error(
            "Kullanıcı bilgisi alınamadı."
          );

        }



        currentUser =
          data.user;



        /*
          ÇALIŞAN YETKİSİNİ KONTROL ET
        */


        await checkEmployeeAuthorization();



      } catch (
        error
      ) {


        console.error(
          "Giriş hatası:",
          error
        );


        showLoginError(
          error.message ||
          "Giriş yapılırken hata oluştu."
        );


      } finally {


        loginButton.disabled =
          false;


        loginButton.innerText =
          "Giriş Yap";

      }

    }



    /*
      ========================================
      GİRİŞ HATA MESAJI
      ========================================
    */


    function showLoginError(
      message
    ) {


      const errorBox =
        document.getElementById(
          "loginError"
        );


      errorBox.innerText =
        message;


      errorBox.style.display =
        "block";

    }



    /*
      ========================================
      ÇALIŞAN YETKİ KONTROLÜ
      ========================================
    */


    async function checkEmployeeAuthorization() {


      if (
        !currentUser
      ) {

        return;

      }



      try {


        const {
          data,
          error
        } =
        await supabaseClient
          .from(
            "authorized_employees"
          )
          .select(
            "*"
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .maybeSingle();



        if (
          error
        ) {

          console.error(
            "Çalışan kontrol hatası:",
            error
          );


          throw error;

        }



        /*
          KULLANICI YETKİLİ LİSTESİNDE YOK
        */


        if (
          !data
        ) {


          await supabaseClient
            .auth
            .signOut();



          currentUser =
            null;



          showLoginError(
            "Bu hesap rezervasyon sistemini kullanmaya yetkili değil."
          );


          return;

        }



        currentEmployee =
          data;



        /*
          UYGULAMAYI AÇ
        */


        document
          .getElementById(
            "loginScreen"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "app"
          )
          .style.display =
          "block";



        /*
          KULLANICI BİLGİSİ
        */


        const employeeName =
          currentEmployee.full_name ||
          currentUser.email;



        document
          .getElementById(
            "userInfo"
          )
          .innerHTML =
          `
            👤 <strong>
              ${escapeHtml(
                employeeName
              )}
            </strong>
            <br>
            <small>
              ${escapeHtml(
                currentUser.email
              )}
            </small>
          `;



        /*
          REZERVASYON EKLEME YETKİSİ
        */


        const canCreate =
          currentEmployee
            .can_create_reservation ===
          true;



        if (
          !canCreate
        ) {


          document
            .getElementById(
              "permissionWarning"
            )
            .style.display =
            "block";


          disableReservationForm();

        } else {


          enableReservationForm();

        }



        /*
          REZERVASYONLARI YÜKLE
        */


        await loadReservations();



      } catch (
        error
      ) {


        console.error(
          "Yetki kontrol hatası:",
          error
        );



        await supabaseClient
          .auth
          .signOut();



        currentUser =
          null;


        currentEmployee =
          null;



        showLoginError(
          "Çalışan yetkisi kontrol edilirken hata oluştu. Supabase RLS ayarlarını kontrol edin."
        );

      }

    }



    /*
      ========================================
      FORMU PASİF YAP
      ========================================
    */


    function disableReservationForm() {


      const elements =
        document
          .getElementById(
            "reservationFormCard"
          )
          .querySelectorAll(
            "input, select, textarea, button"
          );



      elements.forEach(
        element => {

          element.disabled =
            true;

        }
      );

    }



    /*
      ========================================
      FORMU AKTİF YAP
      ========================================
    */


    function enableReservationForm() {


      const elements =
        document
          .getElementById(
            "reservationFormCard"
          )
          .querySelectorAll(
            "input, select, textarea, button"
          );



      elements.forEach(
        element => {

          element.disabled =
            false;

        }
      );

    }



    /*
      ========================================
      ÇIKIŞ YAP
      ========================================
    */


    async function logout() {


      await supabaseClient
        .auth
        .signOut();



      currentUser =
        null;


      currentEmployee =
        null;


      reservations =
        [];



      document
        .getElementById(
          "app"
        )
        .style.display =
        "none";



      document
        .getElementById(
          "loginScreen"
        )
        .style.display =
        "flex";



      document
        .getElementById(
          "loginPassword"
        )
        .value =
        "";

    }



    /*
      ========================================
      OTURUM KONTROLÜ
      ========================================
    */


    async function checkSession() {


      try {


        const {
          data:
          {
            session
          }
        } =
        await supabaseClient
          .auth
          .getSession();



        if (
          session &&
          session.user
        ) {


          currentUser =
            session.user;



          await checkEmployeeAuthorization();


        } else {


          document
            .getElementById(
              "loginScreen"
            )
            .style.display =
            "flex";


          document
            .getElementById(
              "app"
            )
            .style.display =
            "none";

        }


      } catch (
        error
      ) {


        console.error(
          "Oturum kontrol hatası:",
          error
        );

      }

    }



    /*
      ========================================
      SUPABASE'DEN
      REZERVASYONLARI ÇEK
      ========================================
    */


    async function loadReservations() {


      try {


        document
          .getElementById(
            "reservationList"
          )
          .innerHTML =
          `
            <div class="loading">
              Rezervasyonlar yükleniyor...
            </div>
          `;



        const {
          data,
          error
        } =
        await supabaseClient
          .from(
            "reservations"
          )
          .select(
            "*"
          )
          .order(
            "reservation_date",
            {
              ascending:
                true
            }
          )
          .order(
            "reservation_time",
            {
              ascending:
                true
            }
          );



        if (
          error
        ) {

          console.error(
            "Supabase yükleme hatası:",
            error
          );


          throw error;

        }



        reservations =
          data ||
          [];



        renderReservations();



      } catch (
        error
      ) {


        console.error(
          "Rezervasyon yükleme hatası:",
          error
        );



        document
          .getElementById(
            "reservationList"
          )
          .innerHTML =
          `
            <div class="empty">
              Rezervasyonlar yüklenirken bir hata oluştu.
              <br><br>
              ${escapeHtml(
                error.message ||
                "Bilinmeyen hata"
              )}
            </div>
          `;

      }

    }



    /*
      ========================================
      DOĞUM GÜNÜ ÜCRETİ
      ========================================
    */


    function toggleFee() {


      const birthday =
        document.getElementById(
          "birthday"
        );



      const feeSection =
        document.getElementById(
          "feeSection"
        );



      if (
        birthday.checked
      ) {


        feeSection.style.display =
          "block";


      } else {


        feeSection.style.display =
          "none";

      }

    }



    /*
      ========================================
      YENİ REZERVASYON EKLE
      ========================================
    */


    async function addReservation() {


      /*
        ÖNCE YETKİ KONTROLÜ
      */


      if (
        !currentUser ||
        !currentEmployee
      ) {


        alert(
          "Lütfen önce giriş yapın."
        );

        return;

      }



      if (
        currentEmployee
          .can_create_reservation !==
        true
      ) {


        alert(
          "Bu hesabın rezervasyon ekleme yetkisi bulunmuyor."
        );

        return;

      }



      const name =
        document
          .getElementById(
            "name"
          )
          .value
          .trim();



      const people =
        document
          .getElementById(
            "people"
          )
          .value;



      const date =
        document
          .getElementById(
            "date"
          )
          .value;



      const time =
        document
          .getElementById(
            "time"
          )
          .value;



      const area =
        document
          .getElementById(
            "area"
          )
          .value;



      const birthday =
        document
          .getElementById(
            "birthday"
          )
          .checked;



      const birthdayFee =
        document
          .getElementById(
            "birthdayFee"
          )
          .value ===
        "true";



      const note =
        document
          .getElementById(
            "note"
          )
          .value
          .trim();



      /*
        ZORUNLU ALAN KONTROLÜ
      */


      if (
        name === "" ||
        people === "" ||
        date === ""
      ) {


        alert(
          "Lütfen Ad Soyad, Kişi Sayısı ve Tarih alanlarını doldurun."
        );

        return;

      }



      const addButton =
        document.getElementById(
          "addButton"
        );



      addButton.disabled =
        true;



      addButton.innerText =
        "Kaydediliyor...";



      /*
        SUPABASE'E
        GÖNDERİLECEK VERİ
      */


      const reservation = {


        customer_name:
          name,


        phone:
          null,


        reservation_date:
          date,


        reservation_time:
          time
            ? time
            : null,


        guest_count:
          Number(
            people
          ),


        area:
          area,


        requested_table:
          null,


        notes:
          note
            ? note
            : null,


        is_birthday:
          birthday,


        birthday_fee:
          birthday
            ? birthdayFee
            : false,


        status:
          "Aktif"

      };



      try {


        const {
          data,
          error
        } =
        await supabaseClient
          .from(
            "reservations"
          )
          .insert(
            [
              reservation
            ]
          )
          .select();



        if (
          error
        ) {


          console.error(
            "Supabase ekleme hatası:",
            error
          );


          throw error;

        }



        console.log(
          "Eklenen rezervasyon:",
          data
        );



        alert(
          "Rezervasyon başarıyla eklendi!"
        );



        /*
          FORMU TEMİZLE
        */


        document
          .getElementById(
            "name"
          )
          .value =
          "";



        document
          .getElementById(
            "people"
          )
          .value =
          "";



        document
          .getElementById(
            "time"
          )
          .value =
          "";



        document
          .getElementById(
            "note"
          )
          .value =
          "";



        document
          .getElementById(
            "birthday"
          )
          .checked =
          false;



        document
          .getElementById(
            "birthdayFee"
          )
          .value =
          "false";



        toggleFee();



        /*
          VERİLERİ
          YENİDEN ÇEK
        */


        await loadReservations();



      } catch (
        error
      ) {


        console.error(
          "Rezervasyon ekleme hatası:",
          error
        );



        let message =
          "Rezervasyon kaydedilirken hata oluştu.";



        if (
          error.message
        ) {


          message +=
            "\n\n" +
            error.message;

        }



        alert(
          message
        );



      } finally {


        if (
          currentEmployee &&
          currentEmployee
            .can_create_reservation ===
          true
        ) {


          addButton.disabled =
            false;

        }



        addButton.innerText =
          "Rezervasyon Ekle";

      }

    }



    /*
      ========================================
      GÜVENLİ METİN GÖSTERİMİ
      ========================================
    */


    function escapeHtml(
      text
    ) {


      if (
        text === null ||
        text === undefined
      ) {


        return "";

      }



      const div =
        document.createElement(
          "div"
        );



      div.textContent =
        text;



      return div.innerHTML;

    }



    /*
      ========================================
      REZERVASYONLARI GÖSTER
      ========================================
    */


    function renderReservations() {


      const list =
        document.getElementById(
          "reservationList"
        );



      const filterDate =
        document
          .getElementById(
            "filterDate"
          )
          .value;



      const filtered =
        reservations
          .filter(
            reservation =>
              reservation.reservation_date ===
              filterDate
          )
          .sort(
            (
              a,
              b
            ) => {


              const timeA =
                a.reservation_time ||
                "99:99";



              const timeB =
                b.reservation_time ||
                "99:99";



              return (
                timeA.localeCompare(
                  timeB
                )
              );

            }
          );



      list.innerHTML =
        "";



      if (
        filtered.length === 0
      ) {


        list.innerHTML =
          `
            <div class="empty">
              Bu tarih için rezervasyon bulunmuyor.
            </div>
          `;


      } else {


        filtered.forEach(
          reservation => {



            let birthdayText =
              "";



            if (
              reservation.is_birthday
            ) {


              const feeText =
                reservation.birthday_fee
                  ? "Ücret Var"
                  : "Ücret Yok";



              birthdayText =
                `
                  <br>
                  🎂 Doğum Günü:
                  ${feeText}
                `;

            }



            const timeText =
              reservation.reservation_time
                ? reservation
                    .reservation_time
                    .substring(
                      0,
                      5
                    )
                : "Saat belirtilmedi";



            let noteText =
              "";



            if (
              reservation.notes
            ) {


              noteText =
                `
                  <br>
                  📝 Not:
                  ${escapeHtml(
                    reservation.notes
                  )}
                `;

            }



            list.innerHTML +=
              `

                <div class="reservation">

                  <div class="reservation-top">

                    <div class="reservation-name">

                      ${escapeHtml(
                        reservation.customer_name
                      )}

                    </div>


                    <button
                      class="delete-btn"
                      onclick="
                        deleteReservation(
                          '${reservation.id}'
                        )
                      "
                    >
                      Sil
                    </button>

                  </div>


                  <div class="reservation-info">

                    👥
                    ${reservation.guest_count}
                    kişi

                    <br>

                    🕒
                    ${timeText}

                    <br>

                    📍
                    ${escapeHtml(
                      reservation.area
                    )}

                    ${birthdayText}

                    ${noteText}

                  </div>

                </div>

              `;

          }
        );

      }



      updateStats(
        filtered
      );

    }



    /*
      ========================================
      İSTATİSTİKLER
      ========================================
    */


    function updateStats(
      filteredReservations
    ) {


      const totalReservations =
        filteredReservations.length;



      const totalPeople =
        filteredReservations.reduce(
          (
            total,
            reservation
          ) =>
            total +
            Number(
              reservation.guest_count ||
              0
            ),
          0
        );



      document
        .getElementById(
          "reservationCount"
        )
        .innerText =
        totalReservations;



      document
        .getElementById(
          "peopleCount"
        )
        .innerText =
        totalPeople;

    }



    /*
      ========================================
      REZERVASYON SİL
      ========================================
    */


    async function deleteReservation(
      id
    ) {


      if (
        !currentUser ||
        !currentEmployee
      ) {


        alert(
          "Bu işlem için giriş yapmalısınız."
        );

        return;

      }



      const confirmDelete =
        confirm(
          "Bu rezervasyonu silmek istediğinize emin misiniz?"
        );



      if (
        !confirmDelete
      ) {

        return;

      }



      try {


        const {
          error
        } =
        await supabaseClient
          .from(
            "reservations"
          )
          .delete()
          .eq(
            "id",
            id
          );



        if (
          error
        ) {


          console.error(
            "Supabase silme hatası:",
            error
          );


          throw error;

        }



        alert(
          "Rezervasyon silindi."
        );



        await loadReservations();



      } catch (
        error
      ) {


        console.error(
          "Rezervasyon silme hatası:",
          error
        );



        alert(
          "Rezervasyon silinirken hata oluştu.\n\n" +
          (
            error.message ||
            ""
          )
        );

      }

    }



    /*
      ========================================
      BUGÜNÜ GÖSTER
      ========================================
    */


    function showToday() {


      document
        .getElementById(
          "filterDate"
        )
        .value =
        getToday();



      renderReservations();

    }



    /*
      ========================================
      ENTER İLE GİRİŞ
      ========================================
    */


    document
      .getElementById(
        "loginPassword"
      )
      .addEventListener(
        "keydown",
        function(
          event
        ) {


          if (
            event.key ===
            "Enter"
          ) {


            login();

          }

        }
      );



    /*
      ========================================
      OTURUM DEĞİŞİKLİĞİNİ DİNLE
      ========================================
    */


    supabaseClient
      .auth
      .onAuthStateChange(
        (
          event,
          session
        ) => {


          console.log(
            "Auth durumu:",
            event
          );


          if (
            event ===
            "SIGNED_OUT"
          ) {


            currentUser =
              null;


            currentEmployee =
              null;

          }

        }
      );



    /*
      ========================================
      SAYFA AÇILINCA
      OTURUM KONTROLÜ
      ========================================
    */


    checkSession();


  </script>
